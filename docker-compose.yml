services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: data_futbol
      POSTGRES_USER: data_futbol
      POSTGRES_PASSWORD: data_futbol
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_futbol -d data_futbol"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
