[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-futbol"
version = "0.1.0"
description = "Historical football analytics data platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a PostgreSQL database configured through DATABASE_URL",
]
